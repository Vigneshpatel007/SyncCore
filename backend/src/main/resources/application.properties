spring.application.name=synccore
server.port=${PORT:8080}

# ---- Database (values after ':' are defaults; Docker overrides them with env variables) ----
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:${MYSQLHOST:localhost}}:${DB_PORT:${MYSQLPORT:3306}}/${DB_NAME:${MYSQLDATABASE:synccore}}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:root}}

# ---- JPA / Hibernate ----
# update = Hibernate creates/alters tables automatically from the @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- JWT (NEVER hard-code a real secret in production; use the JWT_SECRET env variable) ----
app.jwt.secret=${JWT_SECRET:synccore-demo-secret-key-change-me-in-production-0123456789}
app.jwt.expiration-ms=86400000

# ---- Actuator (Unit 8: monitoring) ----
management.endpoints.web.exposure.include=health,info,metrics

# ---- Logging pattern (Unit 8: structured logging) ----
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
logging.level.com.synccore=INFO
