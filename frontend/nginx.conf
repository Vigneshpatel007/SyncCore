server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # React Router: any unknown URL falls back to index.html
  location / {
    try_files $uri /index.html;
  }

  # API calls are forwarded to the Spring Boot container (service name "backend")
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
